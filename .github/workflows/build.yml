name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r27c
      - name: Build
        run: cd ipafetch && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPAFetch-APK
          path: ipafetch/app/build/outputs/apk/debug/app-debug.apk
