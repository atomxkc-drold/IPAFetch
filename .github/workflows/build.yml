name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
      - name: Build
        run: cd ipafetch && /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPAFetch-APK
          path: ipafetch/app/build/outputs/apk/debug/app-debug.apk
