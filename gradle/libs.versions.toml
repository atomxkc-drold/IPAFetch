[versions]
android = "8.1.4"
kotlin = "1.9.24"
hilt = "2.51"
compose-bom = "2024.05.00"
ksp = "1.9.24-1.0.20"
room = "2.6.1"
sqlcipher = "4.5.3"
tink = "1.13.0"
biometric = "1.2.0-alpha05"
navigation = "2.7.7"
serialization = "1.6.3"
hilt-navigation = "1.0.0"
hilt-compose = "1.0.0"
work = "2.9.0"
coil = "2.6.0"
security = "1.1.0-alpha06"

[plugins]
android-application = { id = "com.android.application", version.ref = "android" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android = { id = "dagger.hilt.android.plugin", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
android-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
android-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }
android-material = { group = "com.google.android.material", name = "material", version = "1.11.0" }
android-fragment = { group = "androidx.fragment", name = "fragment-ktx", version = "1.6.2" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version = "1.9.0" }
compose-hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }
compose-hilt-work = { group = "androidx.hilt", name = "hilt-work-compose", version = "1.1.0" }

# Lifecycle
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.7.0" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version = "2.7.0" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.7.0" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.7.0" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# SQLCipher
net-sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

# Tink
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }



# Biometric
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# EncryptedSharedPreferences / MasterKeys
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security" }

# Serialization
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Test
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version = "1.9.24" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version = "1.9.24" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Testing
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-espresso = { group = "androidx.test.ext", name = "espresso-core", version = "3.5.1" }
