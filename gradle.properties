android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# The dexer needs more than the 512 MB default; D8/R8 thrash otherwise.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true

# Do not commit a machine-local JDK path here: CI runners have no such
# directory and Gradle aborts during launcher init before any task runs.
# Point a single build at a specific JDK instead, e.g.
#   JAVA_HOME=/path/to/jdk17 ./gradlew assembleDebug
# or keep org.gradle.java.home in your own ~/.gradle/gradle.properties.
